<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packet walkthrough</title>
<style>

:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#dde1e8;
  --accent:#1f5fbf; --accent-soft:#e8f0fc; --client:#1f7a4d; --client-soft:#e6f4ec;
  --server:#a3460f; --server-soft:#fbeee4; --ok:#1f7a4d; --bad:#b42318; --warn:#8a5a00;
  --hl:#ffe58a; --sel:#cfe0fb; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:#eef1f5;padding:1px 5px;border-radius:4px}
header.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top h1{font-size:17px;margin:0;font-weight:650}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:7px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:550;cursor:pointer;user-select:none}
nav.tabs a.on{background:var(--accent-soft);color:var(--accent)}
.view{display:none}
.view.on{display:block}
/* ---------- Start ---------- */
.page{max-width:980px;margin:0 auto;padding:28px 20px 40px}
.scenario{background:linear-gradient(135deg,#eaf2ff,#f4f8ff);border:1px solid #c9dafa;border-left:6px solid var(--accent);border-radius:14px;padding:26px 30px;margin-bottom:30px}
.scenario h2{margin:0 0 10px;font-size:26px}
.scenario p{font-size:16.5px;margin:8px 0}
.netbox{display:flex;align-items:center;justify-content:center;gap:18px;margin:20px 0 6px;flex-wrap:wrap}
.host{background:#fff;border:2px solid;border-radius:12px;padding:10px 16px;text-align:center;min-width:190px}
.host.c{border-color:var(--client)} .host.s{border-color:var(--server)}
.host b{display:block;font-size:15px} .host span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.wire{font-family:var(--mono);color:var(--muted);font-size:13px;text-align:center}
.wire div{border-top:2px dashed #9aa6b8;width:150px;margin:4px auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:30px}
.card h3{margin:0 0 10px;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:800px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-block;padding:10px 18px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;cursor:pointer;border:0;font-size:15px}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid #bcd0f2}
.prepared{text-align:center;color:var(--muted);margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
ol.plain li,ul.plain li{margin:4px 0}
/* ---------- Walkthrough ---------- */
.wt{display:grid;grid-template-columns:250px 1fr;gap:0;min-height:calc(100vh - 53px)}
.rail{background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
.rail .phase{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 8px 4px;font-weight:650}
.rail a{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14px;line-height:1.3}
.rail a .n{flex:0 0 22px;height:22px;border-radius:50%;background:#eef1f5;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:650}
.rail a.on{background:var(--accent-soft)} .rail a.on .n{background:var(--accent);color:#fff}
.rail a.done .n{background:#d6efe0;color:var(--ok)}
.main{padding:18px 22px 40px;min-width:0}
@media (max-width:900px){.wt{grid-template-columns:1fr}.rail{position:static;height:auto;max-height:260px;border-right:0;border-bottom:1px solid var(--line)}header.top{flex-wrap:wrap}nav.tabs{margin-left:0}.main{padding:14px 12px 30px}}
.stephead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stephead h2{margin:0;font-size:22px}
.pill{font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:#eef1f5;color:var(--muted)}
.pill.c{background:var(--client-soft);color:var(--client)} .pill.s{background:var(--server-soft);color:var(--server)}
.stepbody{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:18px;margin-bottom:16px}
@media (max-width:1100px){.stepbody{grid-template-columns:1fr}}
.explain{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.explain p{margin:8px 0}
.explain h4{margin:14px 0 4px;font-size:15px}
.box{border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14.5px}
.box.why{background:#fff8e6;border:1px solid #f1dca5}
.box.ws{background:#eef5ff;border:1px solid #cddcf6}
.box.sec{background:#fdeeee;border:1px solid #f3c9c5}
.box b.t{display:block;margin-bottom:2px;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.box.why b.t{color:var(--warn)} .box.ws b.t{color:var(--accent)} .box.sec b.t{color:var(--bad)}
.kv{font-family:var(--mono);font-size:12.5px;background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;word-break:break-all}
.kv div{margin:2px 0} .kv span{color:var(--muted)}
table.neg{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
table.neg th,table.neg td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
table.neg th{background:#f3f5f8}
table.neg td.win{font-family:var(--mono);color:var(--ok);font-weight:650}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.diagram{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.diagram h5,.quiz h5{margin:2px 4px 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.quiz{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.quiz .q{font-weight:600;margin:0 0 8px}
.quiz label{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;font-size:14px}
.quiz label:hover{background:#f7f9fc}
.quiz input{margin-right:8px}
.quiz label.right{border-color:#8fd0a9;background:#eaf7ef}
.quiz label.wrong{border-color:#f0a8a1;background:#fdeeee}
.quiz .fb{font-size:14px;margin-top:8px;display:none}
.quiz .fb.show{display:block}
.navrow{display:flex;justify-content:space-between;margin:6px 0 16px}
.terminal{background:#fbfbf7;border:1px solid #d9d6c3;border-radius:8px;font-family:var(--mono);font-size:12.5px;padding:10px 12px;white-space:pre-wrap;word-break:break-all}
/* ---------- Packet viewer ---------- */
.viewer{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafbfc;font-size:13.5px}
.vbar label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.vbar .ttl{font-weight:650;margin-right:4px}
.filter{flex:1 1 320px;display:flex;gap:6px;align-items:center}
.filter input{flex:1;font-family:var(--mono);font-size:13px;padding:6px 9px;border:1px solid #c7ced9;border-radius:7px}
.filter input.ok{background:#eaf7ef;border-color:#8fd0a9} .filter input.err{background:#fdeeee;border-color:#f0a8a1}
.plist{max-height:240px;overflow:auto;border-bottom:1px solid var(--line)}
table.pk{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
table.pk th{position:sticky;top:0;z-index:3;background:#f1f3f6;text-align:left;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-family:system-ui,sans-serif;font-size:12.5px}
table.pk td{padding:3px 8px;white-space:nowrap;border-bottom:1px solid #f0f2f5;cursor:pointer}
table.pk td.info{white-space:normal;min-width:260px}
table.pk tr.r-tcp td{background:#f1f0ff} table.pk tr.r-ack td{background:#f8f8fb;color:#6b7280}
table.pk tr.r-ssh td{background:#fff} table.pk tr.r-ign td{background:#fbfbfb;color:#8a8f99}
table.pk tr.r-enc td{background:#fff7f0}
table.pk tr.dim td{opacity:.35}
table.pk tr.focus td{box-shadow:inset 0 0 0 9999px rgba(31,95,191,.06)}
table.pk tr.focus td:first-child{border-left:4px solid var(--accent)}
table.pk tr.sel td{background:var(--sel)!important;opacity:1;color:var(--ink)}
.dir{display:inline-block;width:18px;text-align:center;font-weight:700}
.dir.c{color:var(--client)} .dir.s{color:var(--server)}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:300px}
@media (max-width:900px){.lower{grid-template-columns:1fr}}
.tree{border-right:1px solid var(--line);overflow:auto;max-height:420px;padding:6px 4px;font-family:var(--mono);font-size:12.5px}
.tree ul{list-style:none;margin:0;padding-left:16px}
.tree>ul{padding-left:4px}
.tree li>div{padding:1px 4px;border-radius:4px;cursor:pointer;white-space:nowrap;display:flex;gap:4px}
.tree li>div:hover{background:#f1f5fc}
.tree li>div.sel{background:var(--sel)}
.tree li>div.key{font-weight:700}
.tree .tw{display:inline-block;width:12px;color:#8a93a3;flex:0 0 12px}
.tree li.closed>ul{display:none}
.tree .sect{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);margin:8px 4px 2px;font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.bytes{overflow:auto;max-height:420px}
.btabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:#fafbfc;padding:4px 6px 0}
.btabs a{font-size:12.5px;padding:5px 10px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted)}
.btabs a.on{background:#fff;border-color:var(--line);color:var(--ink);margin-bottom:-1px}
.hex{font-family:var(--mono);font-size:12.5px;padding:6px 10px;line-height:1.6}
.hex .row{display:flex;gap:14px;white-space:pre}
.hex .off{color:#8a93a3}
.hex .b{padding:0 1px;border-radius:2px;cursor:pointer}
.hex .b.h{background:var(--hl)}
.hex .a{color:#4b5563}
.hex .a .h{background:var(--hl)}
.encnote{margin:8px 10px;font-size:13px;color:var(--warn);background:#fff8e6;border:1px solid #f1dca5;border-radius:8px;padding:6px 10px;font-family:system-ui,sans-serif}
/* ---------- Sequence diagram ---------- */
svg.seq text{font-family:system-ui,sans-serif}
svg.seq .arrow{cursor:pointer}
svg.seq .arrow:hover line,svg.seq .arrow:hover path{stroke-width:2.6}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.layers{border-collapse:collapse;width:100%;font-size:14px}
table.layers th,table.layers td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.layers th{background:#f3f5f8}
.backtop{display:block;text-align:right;margin-top:10px;font-size:14px}

.pkt{display:flex;flex-wrap:wrap;gap:0;margin:10px 0;font-family:var(--mono);font-size:12px;text-align:center}
.pkt div{border:1px solid #9aa6b8;padding:7px 8px;margin-right:-1px}
.pkt .o{background:#eef1f5}.pkt .e{background:#fbeee4}.pkt .i{background:#e6f4ec}.pkt .t{background:#fff8e6}
.pkt small{display:block;color:var(--muted);font-family:system-ui,sans-serif;font-size:10.5px}
.mini{font-size:13px;color:var(--muted)}
.netbox.wide{gap:8px;flex-wrap:nowrap;overflow-x:auto}.netbox.wide .host{min-width:0;padding:8px 10px}.netbox.wide .host b{font-size:13.5px}.netbox.wide .host span{font-size:12px}.netbox.wide .wire{font-size:11.5px}
table.pk tr.r-tcp td{background:#f1f0ff} table.pk tr.r-ack td{background:#f8f8fb;color:#6b7280}
table.pk tr.r-clear td{background:#fff} table.pk tr.r-enc td{background:#fff7f0} table.pk tr.r-dec td{background:#f3faf5}
.keyfiles a{margin-right:14px}
.btabs{flex-wrap:nowrap;overflow-x:auto}.btabs a{white-space:nowrap}
</style>
</head>
<body>
<header class="top" id="top">
  <h1 id="hdr"></h1>
  <nav class="tabs" id="tabs">
    <a data-v="start" class="on">Start</a>
    <a data-v="walk">Walkthrough</a>
    <a data-v="big">Big Picture</a>
    <a data-v="explore">Explore the Capture</a>
  </nav>
</header>
<section class="view on" id="v-start"><div class="page" id="start"></div></section>
<section class="view" id="v-walk">
 <div class="wt">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <div class="stephead"><h2 id="st-title"></h2><span class="pill" id="st-frames"></span><span class="pill" id="st-phase"></span></div>
    <div class="stepbody">
      <div class="explain" id="st-body"></div>
      <div class="side">
        <div class="diagram"><h5>Packets in this step</h5><div id="st-diag"></div></div>
        <div class="quiz" id="st-quiz"></div>
      </div>
    </div>
    <div class="navrow"><a class="btn ghost" id="prev">← Previous step</a><a class="btn" id="next">Next step →</a></div>
    <div id="walk-viewer"></div>
    <a class="backtop" href="#top">↑ Back to Top</a>
  </div>
 </div>
</section>
<section class="view" id="v-big"><div class="page" style="max-width:1100px" id="big"></div></section>
<section class="view" id="v-explore">
 <div class="page" style="max-width:1400px">
  <div class="scenario" style="padding:18px 24px" id="explore-intro"></div>
  <div id="explore-viewer"></div>
  <a class="backtop" href="#top">↑ Back to Top</a>
 </div>
</section>

const P=D.pk, X=D.calc||{}, byNo={}; P.forEach(p=>byNo[p.no]=p);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V=(p,dec)=>(dec&&p.dec)?p.dec:p.enc;
function fld(no,name,dec=true){const v=V(byNo[no],dec).fields[name];return v?v[0]:''}
function fldAll(no,name,dec=true){return V(byNo[no],dec).fields[name]||[]}
const CLI='192.168.1.10';
const short=h=>h?h.slice(0,16)+'…'+h.slice(-8):'';
const tcpLab=p=>{const m=p.enc.info.match(/\[([^\]]+)\]/);return m?m[1].replace(', ','+'):'TCP'};
const CFG={
title:'HTTPS with TLS 1.3: A Packet Walkthrough',
decLabel:'Decrypt with key log',
encNote:'This record is encrypted. Turn on "Decrypt with key log" to read it.',
openProtos:['tls','http'],openDepth:3,openMatch:/^(Extension: (server_name|key_share|supported_versions)|Key Share extension|Key Share Entry|Certificates \(|Certificate \[|Server Name Indication)/,
keyFields:['tls.handshake.random','tls.handshake.ciphersuite','tls.handshake.extensions_server_name','tls.handshake.extensions_key_share_key_exchange','tls.handshake.client_cert_vrfy.sig','tls.handshake.verify_data','tls.handshake.certificate','http.request.uri','tls.alert_message.desc'],
lanes:[['Client (browser)','192.168.1.10'],['Web server','192.168.1.20:443']],
dir:p=>p.enc.src===CLI?'c':'s',
kind:p=>p.dec?'enc':(p.enc.proto==='TCP'?'tcp':'clear'),
main:p=>!p.ack,
label:p=>({4:'Client Hello',6:'Server Hello + encrypted: EE, Certificate, CertificateVerify, Finished',8:'Change Cipher Spec + Finished',9:'New Session Ticket',10:'HTTP GET /index.html',11:'HTTP/1.1 200 OK',13:'Alert: close_notify',15:'Alert: close_notify'})[p.no]||(p.enc.proto==='TCP'?tcpLab(p):V(p,true).info),
phases:[{n:'TCP',a:1,b:3,c:'#f1f2f6'},{n:'TLS handshake',a:4,b:8,c:'#eef4ff'},{n:'After handshake',a:9,b:9,c:'#f4f0ff'},{n:'HTTP (encrypted)',a:10,b:11,c:'#ecf7f0'},{n:'Close',a:12,b:18,c:'#f6f6f6'}],
start:()=>`
<div class="scenario">
  <h2>What really happens when you open an <code>https://</code> page?</h2>
  <p>A user opens <b>https://www.example.com/index.html</b>. The browser and the web server use <b>TLS 1.3</b> to protect the connection. Then the browser asks for the page and gets it back.</p>
  <p>We recorded this with a packet sniffer. The capture has <b>18 packets</b>, from the first TCP packet to the last.</p>
  <div class="netbox">
    <div class="host c"><b>Client (browser)</b><span>192.168.1.10</span></div>
    <div class="wire">HTTPS = HTTP inside TLS<div></div>TCP port 443</div>
    <div class="host s"><b>Web server</b><span>192.168.1.20 : 443</span></div>
  </div>
</div>
<div class="grid2">
  <div class="card"><h3>You will learn</h3><ul class="plain">
    <li>What the Client Hello and Server Hello contain</li>
    <li>How TLS 1.3 creates keys with ECDHE in only one round trip</li>
    <li>How the <b>server</b> proves its identity with a certificate and a signature</li>
    <li>Why the certificate is encrypted in TLS 1.3</li>
    <li>What an observer can and cannot see in HTTPS traffic</li></ul></div>
  <div class="card"><h3>How to use this page</h3><ol class="plain">
    <li>Open <b>Walkthrough</b> and go through the 9 steps.</li>
    <li>Click packets and fields. The bytes light up, as in Wireshark.</li>
    <li>Use the switch <b>Decrypt with key log</b> to see the traffic with and without the keys.</li>
    <li>Answer the short question at the end of each step.</li></ol></div>
</div>
<div class="card">
  <h3>Open the same file in real Wireshark</h3>
  <p>Download the capture: <a data-dl="pcap" href="#">https_tls13.pcapng</a></p>
  <p>The file already contains the TLS key log (the session secrets, stored inside the pcapng file). Wireshark reads it on its own and shows the decrypted handshake and the HTTP messages. The packet details on this page come from Wireshark itself (version 4.2).</p>
  <p>In real life, browsers write such a key log when the environment variable <code>SSLKEYLOGFILE</code> is set. In Wireshark you load it under <i>Edit → Preferences → Protocols → TLS → (Pre)-Master-Secret log filename</i>.</p>
  <p>Useful display filters: <code>tls</code>, <code>tls.handshake.type == 1</code>, <code>http</code>, <code>tls.handshake.extensions_server_name</code>.</p>
</div>
<div style="text-align:center"><a class="btn" data-go="walk">Start the walkthrough →</a></div>`,
explore:`<h2 style="font-size:21px">Explore the capture freely</h2>
<p>This is the full capture, like in Wireshark. Type a display filter with real Wireshark field names and press Enter. Examples:
<code>tls</code> · <code>tls.handshake.type == 1</code> · <code>tls.record.content_type == 23</code> · <code>http</code> · <code>tcp.len &gt; 0</code> · <code>tls.handshake.extensions_server_name == "www.example.com"</code></p>
<p>Try <code>http</code> with and without decryption. Without the keys, there is no HTTP at all. The traffic is only TLS "Application Data".</p>`,
big:()=>`
<div class="scenario" style="padding:20px 26px"><h2 style="font-size:22px">The whole session on one page</h2>
<p>TLS 1.3 needs only <b>one round trip</b> before the client can send its request: Client Hello → Server Hello … Finished → client Finished + request.</p></div>
<div class="card">
<h3>Keys and secrets in TLS 1.3</h3>
<table class="layers">
<tr><th>Phase</th><th>Protected with</th><th>Messages in this capture</th></tr>
<tr><td>Hello messages</td><td>Nothing (clear text)</td><td>Client Hello (4), Server Hello (6)</td></tr>
<tr><td>Rest of the handshake</td><td>Handshake traffic secrets (from the ECDHE shared secret)</td><td>EncryptedExtensions, Certificate, CertificateVerify, Finished (6, 8)</td></tr>
<tr><td>Application data</td><td>Application traffic secrets (<code>*_TRAFFIC_SECRET_0</code>)</td><td>New Session Ticket (9), HTTP (10, 11), close_notify (13, 15)</td></tr>
</table>
<h4 style="margin:18px 0 6px">SSH and TLS compared</h4>
<table class="layers">
<tr><th></th><th>SSH</th><th>TLS 1.3 (HTTPS)</th></tr>
<tr><td>Key exchange</td><td>ECDH (curve25519) after KEXINIT</td><td>ECDHE (x25519) inside the Hello messages</td></tr>
<tr><td>Server proves identity with</td><td>Host key signature over H</td><td>CertificateVerify signature over the handshake transcript</td></tr>
<tr><td>How the client trusts the server key</td><td><code>known_hosts</code> (first use: the user checks the fingerprint)</td><td>Certificate chain to a trusted CA, and the name must match</td></tr>
<tr><td>Client authentication</td><td>Usually yes (key or password), inside SSH</td><td>Usually no in TLS. The user logs in later inside HTTP (password, cookie)</td></tr>
<tr><td>Is the server identity hidden?</td><td>Host key is visible</td><td>Certificate is encrypted, but the SNI name is visible</td></tr>
</table>
<h4 style="margin:18px 0 6px">What a passive observer can see without the keys</h4>
<ul class="plain"><li>IP addresses and ports</li><li>The server name in the SNI (<code>www.example.com</code>)</li><li>Offered and chosen cipher suites and groups</li><li>Size, timing and direction of every record</li></ul>
<p class="mini">Not visible: the certificate, the URL path, HTTP headers, cookies, the page content.</p>
</div>
<div class="card"><h3>Sequence diagram (pure ACKs hidden)</h3>
<div class="legend"><span><i style="background:#8b95a7"></i>TCP</span><span><i style="background:#6d4fc2"></i>Clear text TLS</span><span><i style="background:#c2410c"></i>Encrypted TLS</span><span>Click an arrow to open the packet.</span></div>
<div id="big-diag"></div></div>`,
steps:[
{phase:'Connection',title:'TCP three-way handshake',frames:[1,2,3],focus:1,hl:'tcp.flags',body:()=>`
<p>HTTPS runs on top of TCP. First the browser opens a TCP connection to port <b>443</b>, the standard HTTPS port.</p>
<ul><li><b>Frame 1:</b> SYN from the client (port ${fld(1,'tcp.srcport')}, a random temporary port).</li><li><b>Frame 2:</b> SYN-ACK from the server.</li><li><b>Frame 3:</b> ACK from the client.</li></ul>
<div class="box why"><b class="t">Note for the rest of the tutorial</b>Packets with only the ACK flag and no data only confirm that TCP received data. We explain them once here. The switch <b>Hide pure ACKs</b> hides them.</div>
<div class="box ws"><b class="t">In Wireshark</b>Filter: <code>tcp.flags.syn == 1</code></div>`,
quiz:{q:'Which port does the HTTPS server use?',o:['80','443',fld(1,'tcp.srcport')],a:1,e:'443 is the standard HTTPS port. Port 80 is plain HTTP.'}},

{phase:'TLS handshake',title:'Client Hello',frames:[4],focus:4,hl:'tls.handshake.extensions_key_share_key_exchange',body:()=>`
<p>The client starts the TLS handshake. The Client Hello is <b>not encrypted</b>. It contains:</p>
<ul>
<li><b>Random</b> (32 bytes): a fresh random value. It makes every session different.</li>
<li><b>Cipher suites</b>: ${fldAll(4,'tls.handshake.ciphersuite').length} TLS 1.3 suites. Each one names an AEAD cipher and a hash, for example <code>TLS_AES_256_GCM_SHA384</code>.</li>
<li><b>supported_versions</b>: "I speak TLS 1.3". The old version field still says TLS 1.2 (0x0303). This is on purpose: old middleboxes would block an unknown version number.</li>
<li><b>key_share</b>: the client's <b>temporary x25519 public key</b> (32 bytes). The client guesses the group and sends its key share right away. This saves one round trip.</li>
<li><b>server_name (SNI)</b>: <code>${esc(fld(4,'tls.handshake.extensions_server_name'))}</code>. It tells the server which website the client wants.</li>
<li><b>ALPN</b>: <code>${esc(fld(4,'tls.handshake.extensions_alpn_str'))}</code>: the application protocol inside TLS.</li>
<li><b>signature_algorithms</b>: which signatures the client accepts from the server.</li></ul>
<div class="box sec"><b class="t">Security note</b>The SNI is sent in clear text. An observer (or a firewall) can see which website you visit, even with HTTPS. Encrypted Client Hello (ECH) is a newer extension that hides it.</div>
<div class="box why"><b class="t">Note</b>Some signature algorithms show as "Unknown" in Wireshark 4.2. They are newer algorithms, for example the post-quantum ML-DSA (0x0904 – 0x0906).</div>
<div class="box ws"><b class="t">In Wireshark</b>Filter: <code>tls.handshake.type == 1</code></div>`,
quiz:{q:'Why does the Client Hello already contain a key share?',o:['To encrypt the Client Hello','So that the key exchange is finished after only one round trip','Because the server needs it to choose a certificate'],a:1,e:'The client sends its ECDHE public key in the first message. If the server accepts the group, both sides have the shared secret after the Server Hello.'}},

{phase:'TLS handshake',title:'Server Hello: keys are ready',frames:[6],focus:6,hl:'tls.handshake.ciphersuite',occ:0,body:()=>`
<p>Frame 6 is a large packet. It contains the Server Hello (clear text) and then several <b>encrypted</b> records. Here we look at the Server Hello.</p>
<ul><li><b>Cipher suite chosen:</b> <code>${esc(fld(6,'tls.handshake.ciphersuite'))}</code></li>
<li><b>supported_versions:</b> TLS 1.3</li>
<li><b>key_share:</b> the server's temporary x25519 public key</li>
<li><b>Random:</b> the server's 32 random bytes</li></ul>
<p>Now both sides compute the same <b>ECDHE shared secret</b>. From it (and a hash of the messages so far) they derive the <b>handshake traffic secrets</b>. Everything after the Server Hello is encrypted with them.</p>
<div class="kv"><div><span>Client random:</span> ${short(X.client_random)}</div><div><span>Server random:</span> ${short(X.server_random)}</div></div>
<div class="box why"><b class="t">Change Cipher Spec?</b>You will see a tiny "Change Cipher Spec" record. TLS 1.3 does not need it. It is only there so that old middleboxes think this is a normal TLS 1.2 session ("middlebox compatibility mode").</div>
<div class="box ws"><b class="t">Try it</b>Switch <b>Decrypt with key log</b> off. The four records after the Server Hello become "Application Data". Without the keys, nobody can see what they are.</div>`,
quiz:{q:'From which point on is the TLS 1.3 handshake encrypted?',o:['From the Client Hello','Right after the Server Hello','Only after the Finished messages'],a:1,e:'After the Server Hello both sides have the ECDHE shared secret. All later handshake messages are encrypted with the handshake keys.'}},

{phase:'TLS handshake',title:'Encrypted Extensions and Certificate',frames:[6],focus:6,hl:'tls.handshake.certificate',body:()=>`
<p>Still in frame 6, the server sends two encrypted messages:</p>
<ul><li><b>EncryptedExtensions</b>: extensions that are not needed for the key exchange, for example ALPN = <code>${esc(fld(6,'tls.handshake.extensions_alpn_str'))}</code>.</li>
<li><b>Certificate</b>: the server's X.509 certificate.</li></ul>
<div class="kv"><div><span>Subject:</span> ${esc(X.cert_subject)}</div><div><span>Issuer:</span> ${esc(X.cert_issuer)}</div><div><span>Valid:</span> ${X.not_before} to ${X.not_after}</div><div><span>Public key:</span> ECDSA P-256</div><div><span>SubjectAltName:</span> DNS:www.example.com</div></div>
<p>The certificate binds the server's <b>public key</b> to the name <code>www.example.com</code>. The CA "Demo Lab Root CA" signed it.</p>
<div class="box why"><b class="t">Why it matters</b>In TLS 1.2 the certificate was sent in clear text. In TLS 1.3 it is encrypted, so a passive observer cannot read it. (The SNI in the Client Hello still shows the name.)</div>
<div class="box ws"><b class="t">In Wireshark</b>Open <i>Handshake Protocol: Certificate → Certificates</i> to see all certificate fields.</div>`,
quiz:{q:'Can a passive observer read the server certificate in this TLS 1.3 capture?',o:['Yes, certificates are always public','No, it is sent inside an encrypted record','Only the issuer is visible'],a:1,e:'In TLS 1.3 the Certificate message comes after the Server Hello, so it is encrypted with the handshake keys.'}},

{phase:'TLS handshake',title:'CertificateVerify: server authentication',frames:[6],focus:6,hl:'tls.handshake.client_cert_vrfy.sig',body:()=>`
<p>A certificate alone proves nothing: anyone can copy it. The server must show that it has the matching <b>private key</b>. It does this in <b>CertificateVerify</b>:</p>
<div class="kv"><div>signature = ECDSA-Sign( server private key,</div><div>&nbsp;&nbsp;64 spaces ‖ "TLS 1.3, server CertificateVerify" ‖ 0x00 ‖ Hash(Client Hello … Certificate) )</div><div><span>Transcript hash (SHA-384):</span> ${short(X.transcript_hash)}</div><div><span>Signature algorithm:</span> ecdsa_secp256r1_sha256 (0x0403)</div></div>
<p>The client checks three things:</p>
<ol><li>The certificate chain goes to a CA it trusts. <span style="color:var(--ok);font-weight:650">✓ We checked it: the certificate is signed by "Demo Lab Root CA".</span></li>
<li>The name in the certificate matches the SNI: <code>www.example.com</code>.</li>
<li>The signature is valid for the transcript hash. <span style="color:var(--ok);font-weight:650">✓ We checked it: the signature in this capture is valid.</span></li></ol>
<div class="box sec"><b class="t">Security note</b>The hash covers <b>all handshake messages so far</b>, including both key shares. A man-in-the-middle who changes any message, or puts in his own key share, cannot make a valid signature without the server's private key.</div>
<div class="box ws"><b class="t">Compare with SSH</b>SSH: the host key signs the exchange hash H, and the client trusts the key via <code>known_hosts</code>. TLS: the server key signs the transcript, and the client trusts the key via a CA.</div>`,
quiz:{q:'What does CertificateVerify prove?',o:['That the certificate is not expired','That the server has the private key that belongs to the certificate','That the client is allowed to log in'],a:1,e:'Only the owner of the private key can make a valid signature over this exact handshake transcript.'}},

{phase:'TLS handshake',title:'Finished messages and the key schedule',frames:[6,8],focus:8,hl:'tls.handshake.verify_data',body:()=>`
<p>Both sides end the handshake with a <b>Finished</b> message (server: end of frame 6, client: frame 8). It contains an HMAC over the whole handshake transcript, made with a key derived from the handshake secret.</p>
<p><span style="color:var(--ok);font-weight:650">✓ We checked it: the server Finished value in this capture is correct.</span></p>
<p>If the HMAC is correct, both sides know: we have the same keys, and nobody changed any handshake message.</p>
<p>Now the <b>application traffic secrets</b> are used. These are the secrets in the key log, and the AES-256-GCM keys and IVs derived from them:</p>
<table class="neg"><tr><th>Secret (key log label)</th><th>Derived key / IV</th></tr>
${Object.entries(X.keys||{}).map(([k,v])=>`<tr><td class="mono">${k}<br><span class="mini">${short(v.secret)}</span></td><td class="mono">key ${short(v.key)}<br>iv ${v.iv}</td></tr>`).join('')}</table>
<p class="mini">key = HKDF-Expand-Label(secret, "key", "", 32) and iv = HKDF-Expand-Label(secret, "iv", "", 12).</p>
<div class="box why"><b class="t">Note</b>The client also sends a dummy Change Cipher Spec in frame 8, again only for middlebox compatibility.</div>`,
quiz:{q:'What is inside the Finished message?',o:['The session key','An HMAC over the whole handshake transcript','The server certificate'],a:1,e:'Finished proves that both sides have the same keys and saw the same handshake messages.'}},

{phase:'After handshake',title:'New Session Ticket',frames:[9],focus:9,hl:'tls.handshake.session_ticket_lifetime_hint',body:()=>`
<p>After the handshake, the server sends a <b>New Session Ticket</b>. It is already protected with the application keys.</p>
<ul><li><b>Lifetime:</b> ${esc(fld(9,'tls.handshake.session_ticket_lifetime_hint'))} seconds (2 hours).</li>
<li>The ticket lets the client <b>resume</b> the session later with a pre-shared key (PSK), without a new certificate check.</li></ul>
<div class="box why"><b class="t">Why it matters</b>Resumption makes the next connection faster. With "0-RTT" the client can even send data in its very first message. 0-RTT data can be replayed by an attacker, so servers should accept it only for safe requests.</div>`,
quiz:{q:'What is a session ticket used for?',o:['To resume a later session faster','To log the user in','To revoke the certificate'],a:0,e:'The ticket carries the state for a later PSK-based resumption.'}},

{phase:'HTTP (encrypted)',title:'The HTTP request and response',frames:[10,11],focus:10,hl:'http.request.uri',body:()=>`
<p>Now the real work happens. HTTP runs inside TLS.</p>
<ul><li><b>Frame 10:</b> <code>GET ${esc(fld(10,'http.request.uri'))} HTTP/1.1</code> with <code>Host: www.example.com</code></li>
<li><b>Frame 11:</b> <code>HTTP/1.1 ${esc(fld(11,'http.response.code'))} ${esc(fld(11,'http.response.phrase'))}</code> with a small HTML page</li></ul>
<div class="box ws"><b class="t">Try it</b>Switch decryption off. Frames 10 and 11 are only "Application Data". Look at the bytes: the URL, the headers and the HTML page cannot be seen.</div>
<div class="box sec"><b class="t">What an observer still sees</b>The IP addresses, the SNI name from the Client Hello, and the <b>size</b> of each record. Sizes alone can sometimes tell which page was loaded (traffic analysis).</div>
<div class="box ws"><b class="t">In Wireshark</b>Filter: <code>http</code> (works only with the keys)</div>`,
quiz:{q:'Without the keys, which of these can an observer see?',o:['The URL path /index.html','The cookie and HTTP headers','The server name from the SNI and the record sizes'],a:2,e:'The URL, headers and body are encrypted. The SNI and the metadata are not.'}},

{phase:'Close',title:'Closing the connection',frames:[13,15,16,17,18],focus:13,hl:'tls.alert_message.desc',body:()=>`
<p>The connection ends from the inside out:</p>
<ol><li><b>Frames 13 and 15:</b> each side sends an encrypted TLS alert <b>close_notify</b>: "I will send no more data."</li>
<li><b>Frames 16 – 18:</b> FIN, FIN-ACK, ACK close TCP.</li></ol>
<div class="box why"><b class="t">Why close_notify?</b>Without it, an attacker could cut the connection (send a TCP FIN) and the receiver could not tell if all data arrived. This is called a <b>truncation attack</b>.</div>
<div class="box why"><b class="t">Summary</b>TCP → Client Hello (key share) → Server Hello (key share) → encrypted: EncryptedExtensions, Certificate, CertificateVerify, Finished → client Finished → HTTP → close_notify → TCP close.</div>`,
quiz:{q:'Why does TLS send close_notify before TCP closes?',o:['To protect against truncation attacks','To delete the certificate','To make the packets smaller'],a:0,e:'close_notify is authenticated, so the receiver knows the data ended on purpose.'}}
]};


document.title=CFG.title; $('#hdr').textContent=CFG.title;
$('#start').innerHTML=CFG.start()+`<div class="prepared">Prepared by: MR. Rostami</div>`;
$('#big').innerHTML=CFG.big()+'<a class="backtop" href="#top">↑ Back to Top</a>';
$('#explore-intro').innerHTML=CFG.explore;
document.querySelectorAll('a[data-dl]').forEach(a=>{const f=D.files[a.dataset.dl];a.href=f.uri;a.download=f.name});

/* ---------- packet viewer ---------- */
function makeViewer(root,opts){
  const hasAck=P.some(p=>p.ack);
  root.innerHTML=`<div class="viewer">
  <div class="vbar"><span class="ttl">Packet viewer</span>
   ${opts.filter?'<div class="filter"><input placeholder="Apply a display filter … (press Enter)" spellcheck="false"><a class="btn ghost" style="padding:5px 10px;font-size:13px">Clear</a></div>':''}
   <label><input type="checkbox" class="o-dec" checked> ${esc(CFG.decLabel)}</label>
   ${hasAck?`<label><input type="checkbox" class="o-ack" ${opts.hideAck?'checked':''}> Hide pure ACKs</label>`:''}
  </div>
  <div class="plist"><table class="pk"><thead><tr><th>No.</th><th>Time</th><th>Source</th><th>Destination</th><th>Protocol</th><th>Length</th><th>Info</th></tr></thead><tbody></tbody></table></div>
  <div class="lower"><div class="tree"></div><div class="bytes"><div class="btabs"></div><div class="hex"></div></div></div></div>`;
  const st={sel:null,field:null,src:0,focus:new Set(),filterFn:null};
  const q=s=>root.querySelector(s);
  const dec=()=>q('.o-dec').checked;
  const hideAck=()=>hasAck&&q('.o-ack').checked;
  root.querySelectorAll('.vbar input[type=checkbox]').forEach(x=>x.addEventListener('change',()=>{renderList();if(st.sel)selectPkt(st.sel,false)}));
  if(opts.filter){const inp=q('.filter input');
    const apply=()=>{const v=inp.value.trim();if(!v){st.filterFn=null;inp.className='';renderList();return}
      try{st.filterFn=compileFilter(v);inp.className='ok';inp.title=''}catch(e){st.filterFn=null;inp.className='err';inp.title=e.message}renderList()};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')apply()});
    q('.filter a').addEventListener('click',()=>{inp.value='';apply()});}
  function rowClass(p){const k=CFG.kind(p);if(k==='tcp')return p.ack?'r-ack':'r-tcp';if(k==='enc')return dec()?'r-dec':'r-enc';return 'r-clear'}
  function visible(p){if(st.focus.has(p.no))return true;if(hideAck()&&p.ack)return false;
    if(st.filterFn&&!st.filterFn(V(p,dec()).fields))return false;return true}
  function renderList(){
    const tb=q('tbody');let h='';
    for(const p of P){if(!visible(p))continue;const v=V(p,dec());
      const cl=[rowClass(p)];if(st.focus.size){if(st.focus.has(p.no))cl.push('focus');else cl.push('dim')}
      if(st.sel===p.no)cl.push('sel');const d=CFG.dir(p);
      h+=`<tr data-no="${p.no}" class="${cl.join(' ')}"><td>${p.no}</td><td>${p.time.toFixed(6)}</td><td>${esc(v.src)}</td><td>${esc(v.dst)}</td><td>${esc(v.proto)}</td><td>${p.len}</td><td class="info"><span class="dir ${d}">${d==='c'?'→':'←'}</span>${esc(v.info)}</td></tr>`}
    tb.innerHTML=h||'<tr><td colspan="7" style="color:#8a93a3;padding:10px">No packets match.</td></tr>';
  }
  q('tbody').addEventListener('click',e=>{const tr=e.target.closest('tr[data-no]');if(tr)selectPkt(+tr.dataset.no)});
  function openFlags(nodes,depth,inMain){for(const n of nodes){const main=inMain||CFG.openProtos.includes(n.f);
      n._open=main&&(depth<=CFG.openDepth||(CFG.openMatch&&CFG.openMatch.test(n.l)));if(n.c)openFlags(n.c,main?depth+1:0,main)}}
  let idc=0;
  function treeHTML(nodes){
    return '<ul>'+nodes.map(n=>{const kids=n.c&&n.c.length;n._id=++idc;
      return `<li class="${kids&&!n._open?'closed':''}"><div data-id="${n._id}" class="${CFG.keyFields&&CFG.keyFields.includes(n.f)?'key':''}"><span class="tw">${kids?(n._open?'▾':'▸'):''}</span><span>${esc(n.l)}</span></div>${kids?treeHTML(n.c):''}</li>`}).join('')+'</ul>';
  }
  const idmap={};
  function index(nodes){for(const n of nodes){idmap[n._id]=n;if(n.c)index(n.c)}}
  function selectPkt(no,keepScroll){
    const p=byNo[no];st.sel=no;st.field=null;st.src=0;const v=V(p,dec());
    root.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('sel',+tr.dataset.no===no));
    openFlags(v.tree,0,false);
    q('.tree').innerHTML=treeHTML(v.tree);index(v.tree);
    if(CFG.kind(p)==='enc'&&!dec()&&p.dec)q('.tree').insertAdjacentHTML('beforeend',`<div class="encnote">${esc(CFG.encNote)}</div>`);
    renderTabs();renderHex();
    const tr=root.querySelector(`tbody tr[data-no="${no}"]`);if(tr&&!keepScroll){const pl=q('.plist');pl.scrollTop=Math.max(0,tr.offsetTop-pl.clientHeight/2)}
  }
  function renderTabs(){const v=V(byNo[st.sel],dec());
    q('.btabs').innerHTML=v.srcs.map((s,i)=>`<a data-t="${i}" class="${i===st.src?'on':''}">${esc(s.name)} (${s.hex.length/2} bytes)</a>`).join('')}
  function revealNode(n){const d=q(`.tree div[data-id="${n._id}"]`);if(!d)return;
    root.querySelectorAll('.tree li>div.sel').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');
    let li=d.parentElement.parentElement.closest('li');while(li){li.classList.remove('closed');const tw=li.querySelector(':scope>div .tw');if(tw&&tw.textContent)tw.textContent='▾';li=li.parentElement.closest('li')}
    const tr=q('.tree');tr.scrollTop=Math.max(0,d.offsetTop-tr.offsetTop-60)}
  function pickNode(n){st.field={s:n.s,n:n.n};st.src=n.src;renderTabs();renderHex(true)}
  q('.tree').addEventListener('click',e=>{const d=e.target.closest('li>div');if(!d)return;
    const li=d.parentElement;if(e.target.classList.contains('tw')&&li.querySelector('ul')){li.classList.toggle('closed');e.target.textContent=li.classList.contains('closed')?'▸':'▾';return}
    root.querySelectorAll('.tree li>div.sel').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');pickNode(idmap[+d.dataset.id])});
  q('.tree').addEventListener('dblclick',e=>{const d=e.target.closest('li>div');if(!d)return;const li=d.parentElement;if(li.querySelector('ul')){li.classList.toggle('closed');d.querySelector('.tw').textContent=li.classList.contains('closed')?'▸':'▾'}});
  q('.btabs').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;st.src=+a.dataset.t;st.field=null;renderTabs();renderHex()});
  q('.hex').addEventListener('click',e=>{const b=e.target.closest('.b');if(!b)return;const off=+b.dataset.o;
    const v=V(byNo[st.sel],dec());let best=null;
    (function w(ns){for(const n of ns){if(n.src===st.src&&n.n>0&&off>=n.s&&off<n.s+n.n){if(!best||n.n<=best.n)best=n}if(n.c)w(n.c)}})(v.tree);
    if(!best)return;revealNode(best);pickNode(best)});
  function renderHex(scroll){
    const v=V(byNo[st.sel],dec());const src=v.srcs[st.src]||v.srcs[0];const hx=src.hex;const n=hx.length/2;
    const f=st.field;const inF=i=>f&&i>=f.s&&i<f.s+f.n;let h='';
    for(let r=0;r<n;r+=16){let bs='',as='';
      for(let i=r;i<r+16;i++){if(i<n){const val=parseInt(hx.substr(i*2,2),16);const c=inF(i)?' h':'';
          bs+=`<span class="b${c}" data-o="${i}">${hx.substr(i*2,2)}</span>`+(i%16===7?'  ':' ');
          const ch=val>=32&&val<127?esc(String.fromCharCode(val)):'·';as+=c?`<span class="h">${ch}</span>`:ch}
        else bs+='   '+(i%16===7?' ':'')}
      h+=`<div class="row"><span class="off">${r.toString(16).padStart(4,'0')}</span><span>${bs}</span><span class="a">${as}</span></div>`}
    q('.hex').innerHTML=h;
    if(scroll&&f){const el=q('.hex .b.h');if(el){const hx=q('.bytes');hx.scrollTop=Math.max(0,el.offsetTop-hx.offsetTop-80)}}
  }
  function highlightField(name,occ=0){const v=V(byNo[st.sel],dec());let k=0,hit=null;
    (function w(ns){for(const n of ns){if(!hit&&n.f===name){if(k===occ)hit=n;k++}if(n.c)w(n.c)}})(v.tree);
    if(!hit)return;revealNode(hit);pickNode(hit)}
  renderList();
  return {setFocus(fr){st.focus=new Set(fr);renderList()},select:selectPkt,highlightField};
}

/* ---------- display filter: Wireshark-like, uses the real field names ---------- */
function compileFilter(src){
  const toks=[];const re=/\s*(\(|\)|&&|\|\||==|!=|>=|<=|>|<|!|"[^"]*"|[A-Za-z_][\w.\-]*|0x[0-9a-fA-F]+|\d+\.\d+\.\d+\.\d+|\d+)/y;let m,pos=0;
  while(pos<src.length){re.lastIndex=pos;m=re.exec(src);if(!m||m.index!==pos){if(/^\s+$/.test(src.slice(pos)))break;throw new Error('Cannot read: '+src.slice(pos))}toks.push(m[1]);pos=re.lastIndex}
  let i=0;const peek=()=>toks[i],next=()=>toks[i++];
  const kw={and:'&&',or:'||',not:'!',eq:'==',ne:'!=',gt:'>',lt:'<',ge:'>=',le:'<='};const norm=t=>kw[t]||t;
  const known=new Set();P.forEach(p=>[p.enc,p.dec].forEach(v=>v&&Object.keys(v.fields).forEach(k=>known.add(k))));
  const num=s=>{if(/^0x[0-9a-f]+$/i.test(s))return parseInt(s,16);if(/^-?\d+(\.\d+)?$/.test(s))return +s;if(s==='True')return 1;if(s==='False')return 0;return NaN};
  function or(){let a=and();while(norm(peek())==='||'){next();const b=and(),x=a;a=f=>x(f)||b(f)}return a}
  function and(){let a=un();while(norm(peek())==='&&'){next();const b=un(),x=a;a=f=>x(f)&&b(f)}return a}
  function un(){if(norm(peek())==='!'){next();const a=un();return f=>!a(f)}
    if(peek()==='('){next();const a=or();if(next()!==')')throw new Error('Missing )');return a}
    const name=next();if(!name||!/^[A-Za-z]/.test(name))throw new Error('Field name expected');
    if(!known.has(name)&&!/^(frame|eth|ip|tcp|udp)$/.test(name))throw new Error('Unknown field in this capture: '+name);
    const op=norm(peek());
    if(['==','!=','>','<','>=','<='].includes(op)){next();let v=next();if(v===undefined)throw new Error('Value expected');v=v.replace(/^"|"$/g,'');
      const cmp=(a)=>{const na=num(a),nb=num(v);const A=!isNaN(na)&&!isNaN(nb)?na:String(a),B=!isNaN(na)&&!isNaN(nb)?nb:v;
        return op==='=='?A==B:op==='!='?A!=B:op==='>'?A>B:op==='<'?A<B:op==='>='?A>=B:A<=B};
      return f=>{const x=f[name];if(!x)return false;return op==='!='?x.every(cmp):x.some(cmp)}}
    return f=>!!f[name]}
  const fn=or();if(i<toks.length)throw new Error('Unexpected: '+toks[i]);return fn;
}

/* ---------- sequence diagram ---------- */
function seqSVG(list,opt={}){
  const W=opt.w||560,rowH=opt.rowH||30,top=40,pad=opt.pad||110,cx=pad,sx=W-pad;const Hh=top+list.length*rowH+14;
  let s=`<svg class="seq" viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Sequence diagram">`;
  if(opt.phases){list.forEach((p,i)=>{const ph=CFG.phases.find(x=>p.no>=x.a&&p.no<=x.b);if(ph&&(i===0||!(list[i-1].no>=ph.a&&list[i-1].no<=ph.b))){
      const cnt=list.filter(q=>q.no>=ph.a&&q.no<=ph.b).length;s+=`<rect x="0" y="${top+i*rowH-4}" width="${W}" height="${cnt*rowH}" fill="${ph.c}"/><text x="6" y="${top+i*rowH+12}" font-size="11" fill="#5b6475" font-weight="600">${ph.n}</text>`}})}
  const [L,R]=CFG.lanes;
  s+=`<text x="${cx}" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a4d">${L[0]}</text><text x="${cx}" y="30" text-anchor="middle" font-size="10.5" fill="#5b6475">${L[1]}</text>`;
  s+=`<text x="${sx}" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#a3460f">${R[0]}</text><text x="${sx}" y="30" text-anchor="middle" font-size="10.5" fill="#5b6475">${R[1]}</text>`;
  s+=`<line x1="${cx}" y1="${top-4}" x2="${cx}" y2="${Hh-6}" stroke="#9fb5a8" stroke-width="2"/><line x1="${sx}" y1="${top-4}" x2="${sx}" y2="${Hh-6}" stroke="#c9a68f" stroke-width="2"/>`;
  list.forEach((p,i)=>{const y=top+i*rowH+rowH/2+2;const c2s=CFG.dir(p)==='c';const x1=c2s?cx:sx,x2=c2s?sx:cx;const k=CFG.kind(p);
    const col=k==='tcp'?'#8b95a7':k==='enc'?'#c2410c':'#6d4fc2';const hl=opt.hl&&opt.hl.has(p.no);const tip=c2s?x2-8:x2+8;
    s+=`<g class="arrow" data-no="${p.no}"><rect x="${Math.min(x1,x2)}" y="${y-13}" width="${Math.abs(x2-x1)}" height="20" fill="${hl?'#fff3c4':'transparent'}"/>
      <line x1="${x1}" y1="${y}" x2="${tip}" y2="${y}" stroke="${col}" stroke-width="${hl?2.4:1.6}"/>
      <path d="M${x2} ${y} L${tip} ${y-4.5} L${tip} ${y+4.5} Z" fill="${col}"/>
      <text x="${(cx+sx)/2}" y="${y-4}" text-anchor="middle" font-size="11.5" fill="#1d2330">${esc(CFG.label(p))}${k==='enc'?' 🔒':''}</text>
      <text x="${c2s?cx-8:sx+8}" y="${y+4}" text-anchor="${c2s?'end':'start'}" font-size="10.5" fill="#5b6475">#${p.no}</text></g>`});
  return s+'</svg>';
}

/* ---------- walkthrough ---------- */
const STEPS=CFG.steps;let viewer=null,cur=0;const done=new Set();
function buildRail(){let h='',ph='';STEPS.forEach((s,i)=>{if(s.phase!==ph){ph=s.phase;h+=`<div class="phase">${ph}</div>`}
  h+=`<a data-i="${i}" class="${i===cur?'on':''} ${done.has(i)?'done':''}"><span class="n">${done.has(i)?'✓':i+1}</span><span>${esc(s.title)}</span></a>`});$('#rail').innerHTML=h}
$('#rail').addEventListener('click',e=>{const a=e.target.closest('a[data-i]');if(a)goStep(+a.dataset.i)});
function goStep(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));const s=STEPS[cur];buildRail();
  $('#st-title').textContent=`${cur+1}. ${s.title}`;
  $('#st-frames').textContent=s.frames.length>1?`Frames ${s.frames.join(', ')}`:`Frame ${s.frames[0]}`;
  $('#st-phase').textContent=s.phase;$('#st-body').innerHTML=s.body();
  $('#st-diag').innerHTML=seqSVG(s.frames.map(n=>byNo[n]),{w:520,rowH:32,pad:62,hl:new Set([s.focus])});
  const qz=s.quiz;$('#st-quiz').innerHTML=`<h5>Check yourself</h5><p class="q">${esc(qz.q)}</p>`+qz.o.map((o,k)=>`<label><input type="radio" name="qz" value="${k}">${esc(o)}</label>`).join('')+`<div class="fb"></div>`;
  viewer.setFocus(s.frames);viewer.select(s.focus);if(s.hl)viewer.highlightField(s.hl,s.occ||0);
  $('#prev').style.visibility=cur===0?'hidden':'visible';
  $('#next').textContent=cur===STEPS.length-1?'See the big picture →':'Next step →';window.scrollTo({top:0});
}
$('#st-quiz').addEventListener('change',e=>{const k=+e.target.value;const qz=STEPS[cur].quiz;
  $('#st-quiz').querySelectorAll('label').forEach((l,j)=>{l.classList.remove('right','wrong');if(j===qz.a&&k===qz.a)l.classList.add('right');if(j===k&&k!==qz.a)l.classList.add('wrong')});
  const fb=$('#st-quiz .fb');fb.className='fb show';fb.innerHTML=(k===qz.a?'<b style="color:var(--ok)">Correct.</b> ':'<b style="color:var(--bad)">Not quite.</b> ')+esc(qz.e);
  if(k===qz.a){done.add(cur);buildRail()}});
$('#st-diag').addEventListener('click',e=>{const g=e.target.closest('.arrow');if(g)viewer.select(+g.dataset.no)});
$('#prev').addEventListener('click',()=>goStep(cur-1));
$('#next').addEventListener('click',()=>{if(cur===STEPS.length-1)show('big');else goStep(cur+1)});
let exploreV=null;
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  if(v==='explore'&&!exploreV){exploreV=makeViewer($('#explore-viewer'),{filter:true});exploreV.select(1)}window.scrollTo({top:0})}
$('#tabs').addEventListener('click',e=>{const a=e.target.closest('a[data-v]');if(a)show(a.dataset.v)});
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a)show(a.dataset.go)});
const bd=$('#big-diag');if(bd){bd.innerHTML=seqSVG(P.filter(CFG.main),{w:760,rowH:26,phases:true});
  bd.addEventListener('click',e=>{const g=e.target.closest('.arrow');if(!g)return;show('explore');exploreV.select(+g.dataset.no)})}
document.addEventListener('keydown',e=>{if(!$('#v-walk').classList.contains('on')||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')goStep(cur+1);if(e.key==='ArrowLeft')goStep(cur-1)});
viewer=makeViewer($('#walk-viewer'),{hideAck:true});goStep(0);
</script>
